name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # configure-pages를 빌드 전에 실행해서 base_url을 빌드에 반영
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jupyter Book
        run: |
          jupyter-book build 03_src/book/
          echo "Build output:"
          ls -la 03_src/book/_build/html/

      # Jekyll이 _static 등 언더스코어 폴더를 무시하지 않도록
      - name: Add .nojekyll
        run: touch 03_src/book/_build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 03_src/book/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
