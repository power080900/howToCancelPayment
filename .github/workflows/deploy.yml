name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jupyter-book sphinxcontrib-mermaid ghp-import

      - name: Build Jupyter Book
        run: jupyter-book build 03_src/book/

      - name: Deploy to gh-pages branch
        run: ghp-import -n -p -f 03_src/book/_build/html
